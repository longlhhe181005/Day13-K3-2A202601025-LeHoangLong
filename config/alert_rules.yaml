alerts:
  - name: high_response_latency
    severity: high
    condition: latency_p95_ms > 3000 for 5m
    type: symptom-based
    owner: backend-oncall
    runbook: docs/alerts.md#alert-1
  - name: elevated_error_rate
    severity: critical
    condition: error_rate_pct > 2 for 5m (min 5 requests in window)
    type: symptom-based
    owner: backend-oncall
    runbook: docs/alerts.md#alert-2
  - name: cost_spike
    severity: warning
    condition: sum(cost_usd) over 60m > 2.5 for 2 consecutive evaluations
    type: symptom-based
    owner: ai-platform-lead
    runbook: docs/alerts.md#alert-3
